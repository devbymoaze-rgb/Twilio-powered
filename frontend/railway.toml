# Set this service's Root Directory to "frontend" in the Railway dashboard.
# NEXT_PUBLIC_API_URL must be available at build time (it is inlined into the browser bundle).

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
