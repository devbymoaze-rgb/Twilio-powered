# Set this service's Root Directory to "frontend" in the Railway dashboard.
# NEXT_PUBLIC_API_URL must be set before the first build (it is inlined at build time).

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
